name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 當程式碼推送到 main 分支時觸發

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2' # 建議填入你目前的 flutter --version 版本

      - name: Enable Web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        # 將 <REPOSITORY_NAME> 替換成你的專案名稱，例如 my_garage
        # 這確保了圖片和資源路徑在 GitHub Pages 上能正確讀取
        run: flutter build web --release --base-href /my_garage/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4