name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# 這是解決「上傳失敗」的核心：必須允許寫入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 確保只有一個部署任務在執行，避免衝突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 已經是 v4，Node 20 警告可忽略或待 GitHub 更新

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # flutter-version: '3.22.2' # 如果不確定版本，可以先註解掉改用最新 stable

      - name: Enable Web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --release --base-href /my_garage/ \
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # 確保使用 v3
        with:
          # Flutter Web 編譯後的產物位址
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # 確保使用 v4